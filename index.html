<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vencimientos Firma Digital – Binapps</title>
  
  <style>
    :root {
      --bg:#0f1117; --bg2:#181c27; --bg3:#1e2333; --bg4:#242840;
      --blue:#4f8ef7; --blue2:#2563eb; --blue-glow:rgba(79,142,247,.18);
      --text:#f1f5f9; --muted:#8892a4; --border:rgba(255,255,255,.07);
      --radius:14px;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #fff;
    }

    p.subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 16px;
    }

    .tabla-contenedor {
      width: 100%;
      max-width: 1200px;
      height: 700px; /* Altura generosa para navegar los 400+ registros cómodamente */
      background-color: var(--bg2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Vencimientos Firma Digital</h1>
  <p class="subtitle">Visor oficial sincronizado en tiempo real desde Excel Online (Binapps)</p>

  <div class="tabla-contenedor">
    <iframe src="https://binappssas-my.sharepoint.com/:x:/g/personal/capacitaciones_binapps_co/IQDxYJ3anxIETpyblDSM8rXZAX9V8e2L5uBe01gtGdOfDDk?action=embedview&wdAllowInteractivity=True&wdHideGridlines=False&wdHideHeaders=False&wdDownloadButton=False"></iframe>
  </div>

</body>
</html>
