<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vencimientos Firma Digital – Binapps</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <style>
    :root {
      --bg:#0f1117; --bg2:#181c27; --bg3:#1e2333; --bg4:#242840;
      --blue:#4f8ef7; --blue2:#2563eb; --blue-glow:rgba(79,142,247,.18);
      --red:#f05252; --red-bg:rgba(240,82,82,.13);
      --amber:#f59e0b; --amber-bg:rgba(245,158,11,.13);
      --orange:#fb923c; --orange-bg:rgba(251,146,60,.13);
      --green:#22c55e; --green-bg:rgba(34,197,94,.13);
      --gray:#6b7280; --gray-bg:rgba(107,114,128,.13);
      --text:#f1f5f9; --muted:#8892a4; --border:rgba(255,255,255,.07);
      --radius:14px; --radius-sm:9px;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #fff;
    }

    p.subtitle {
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 16px;
    }

    .tabla-contenedor {
      width: 100%;
      max-width: 1200px;
      background-color: var(--bg2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    #tabla-sincronizada {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    #tabla-sincronizada th {
      background-color: var(--bg3);
      color: var(--blue);
      padding: 14px 16px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    #tabla-sincronizada td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: #e2e8f0;
    }

    #tabla-sincronizada tr:hover {
      background-color: rgba(79, 142, 247, 0.04);
    }

    #estado-carga {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Vencimientos Firma Digital</h1>
  <p class="subtitle">Información sincronizada en tiempo real desde Excel Online</p>

  <div class="tabla-contenedor">
    <div id="estado-carga">🔄 Conectando con SharePoint y cargando registros...</div>
    
    <table id="tabla-sincronizada" style="display: none;">
      <thead>
        <tr id="cabecera-excel"></tr>
      </thead>
      <tbody id="cuerpo-excel"></tbody>
    </table>
  </div>

  <script>
    // Link original de descarga de tu SharePoint
    const urlOriginal = "https://binappssas-my.sharepoint.com/:x:/g/personal/dlemus_binapps_co/IQCbvVdoy_tVRKa-Zl9ND03PAcEekHqeOLLBUX5_8Wq25zA?download=1";
    
    // Le sumamos un proxy externo para romper el bloqueo CORS empresarial de Microsoft
    const urlExcel = "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlOriginal);

    function cargarDatos() {
      Papa.parse(urlExcel, {
        download: true,
        skipEmptyLines: true,
        complete: function(resultado) {
          const datos = resultado.data;
          if (datos.length === 0) return;

          const cabecera = document.getElementById("cabecera-excel");
          const cuerpo = document.getElementById("cuerpo-excel");

          // 1. Pintar Títulos de Columnas (Fila 0 del Excel)
          datos[0].forEach(columna => {
            const th = document.createElement("th");
            th.textContent = columna.replace(/["']/g, "").trim();
            cabecera.appendChild(th);
          });

          // 2. Pintar las filas con los registros
          for (let i = 1; i < datos.length; i++) {
            const fila = datos[i];
            const tr = document.createElement("tr");

            fila.forEach(celda => {
              const td = document.createElement("td");
              td.textContent = celda.replace(/["']/g, "").trim();
              tr.appendChild(td);
            });

            cuerpo.appendChild(tr);
          }

          // Ocultar mensaje de carga y mostrar la tabla
          document.getElementById("estado-carga").style.display = "none";
          document.getElementById("tabla-sincronizada").style.display = "table";
        },
        error: function(error) {
          console.error("Error al sincronizar el Excel:", error);
          document.getElementById("estado-carga").innerHTML = "❌ Error al conectar con el Excel.<br><br>Si el error persiste, significa que la seguridad de SharePoint de tu empresa bloquea accesos web externos. En ese caso, la mejor solución definitiva es usar Google Sheets.";
        }
      });
    }

    // Ejecutar al cargar la página
    window.addEventListener('DOMContentLoaded', cargarDatos);
  </script>

</body>
</html>
